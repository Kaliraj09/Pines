const canonicalSource=x=>String(x||'manual').toLowerCase()==='wpforms'?'wpforms':'manual';

S.contacts=(S.contacts||[]).map(c=>({...c,source:canonicalSource(c.source)}));
const CORE_LISTS=['General Enquiries','Dealership Enquiries','Careers & Jobs'];
const normList=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
// Merge the legacy misspelling into the single canonical dealership list.
const canonicalListName=x=>{
 const n=normList(x);
 if(n==='dealership enquires'||n==='dealership enquiries')return 'Dealership Enquiries';
 if(n==='mobitech staffs')return 'General Enquiries';
 return CORE_LISTS.find(y=>normList(y)===n)||String(x||'').trim();
};
function inferredList(c){
 const formId=String(c.form_id||'');
 if(['30936','11117'].includes(formId))return 'Dealership Enquiries';
 const requirement=String((c.f||{}).requirement||c.requirement||'').toLowerCase();
 if(requirement.includes('dealership'))return 'Dealership Enquiries';
 if(requirement.includes('work with mobitech'))return 'Careers & Jobs';

}
function ensureListSegments(){try{
 S.segments=Array.isArray(S.segments)?S.segments:[];
 S.segments=S.segments.filter(sg=>!/^list\s*:/i.test(String(sg.name||'')) && !sg.autoList && !/^(subscribed|non-subscribed|unsubscribed)$/i.test(String(sg.name||'').trim()));
 const _ids=new Set(S.segments.map(x=>x.id));(S.contacts||[]).forEach(c=>{if(c&&Array.isArray(c.sg))c.sg=c.sg.filter(i=>_ids.has(i))});}catch(e){console.error('ensureListSegments',e)}
}
function ensureLeadDefaults(){
 S.contacts=Array.isArray(S.contacts)?S.contacts:[];
 S.lists=Array.isArray(S.lists)?S.lists:[];
 S.segments=Array.isArray(S.segments)?S.segments:[];
 S.fields=Array.isArray(S.fields)?S.fields:[];
 const formFields=[['phone','Phone'],['country','Country'],['place','Place'],['requirement','Requirement'],['message','Comment or Message']];
 S.removedFields=Array.isArray(S.removedFields)?S.removedFields:[];S.removedLists=Array.isArray(S.removedLists)?S.removedLists:[];
 formFields.forEach(([k,label])=>{if(!S.removedFields.includes(k)&&!S.fields.some(f=>f.k===k))S.fields.push({k,label})});
 // Keep the four audience lists, retain custom lists, and merge legacy aliases.
 const existing=new Map(S.lists.filter(Boolean).map(x=>[normList(canonicalListName(x)),canonicalListName(x)]));
 const rmL=new Set(S.removedLists);const keepL=x=>!rmL.has(normList(x));
 S.lists=[...CORE_LISTS.filter(keepL),...[...existing.values()].filter(keepL).filter(x=>!CORE_LISTS.some(y=>normList(y)===normList(x)) && normList(x)!=='mobitech staffs')];

 S.contacts.forEach(c=>{
  c.tags=Array.isArray(c.tags)?c.tags:[];c.f=c.f||{};

  let memberships=[...new Set(raw.map(x=>String(x||'').trim()).filter(Boolean).map(canonicalListName))];
  const specific=memberships.filter(x=>['Dealership Enquiries','Careers & Jobs'].includes(x));

  // Reclassify only when a strong category keyword is present; otherwise keep General.
  const guess=inferredList(c);

  else if(specific.length&&!(S.formRules&&S.formRules[String(c.form_id||'')]))memberships=memberships.filter(x=>x!=='General Enquiries');

  if(!memberships.length&&keepL('General Enquiries'))memberships=['General Enquiries'];
  c.l=memberships;
 });

 ensureListSegments();
}

let dbOn=false,dbT=null,dbSaveQueue=Promise.resolve();

// Serialize all server writes. This prevents an older delayed autosave from
// finishing after a newer automation/contact save and restoring stale data.
function queueStateSave(snapshot){
  const task=dbSaveQueue.catch(()=>{}).then(async()=>{
    const response=await fetch('api.php?a=save',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Key':KEY()},body:snapshot});
    const raw=await response.text();let result={};try{result=JSON.parse(raw)}catch(e){}
    if(!response.ok||result.ok===false)throw new Error(result.message||raw||('HTTP '+response.status));
    return true;
  });
  dbSaveQueue=task;
  return task;
}

// ---- Deletion safety: tombstones so deleted contacts/fields/lists never come back ----
function markDeleted(emails){S.deletedEmails=S.deletedEmails||{};const t=Date.now();(emails||[]).forEach(e=>{e=String(e||'').trim().toLowerCase();if(e)S.deletedEmails[e]=t})}

// Segments, lists and custom fields are saved to their own database file so a stale tab can never wipe them.

  if(!dbOn){toast('Not connected to the database yet. Wait a moment and try again.');return Promise.resolve(false)}
  const body=JSON.stringify(Object.fromEntries(CFG_KEYS.map(k=>[k,S[k]||[]])));

    const r=await fetch('api.php?a=config',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Key':KEY()},body});
    const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
    if(!r.ok||j.ok===false)throw new Error(j.message||t||('HTTP '+r.status));
    if(j.rev)S.cfgRev=j.rev;return true});
  return cfgQ.then(ok=>{if(okMsg)toast(okMsg);return ok}).catch(e=>{toast('NOT saved to database: '+e.message);return false})

async function pullConfig(){

}

function showAppModal(title,content,wide=false){closeAppModal(false);const d=document.createElement('div');d.id='appModal';d.className='app-modal-backdrop';d.setAttribute('role','presentation');d.innerHTML=`<section class="app-modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="app-modal-head"><div class="sp"><span class="modal-kicker">MAILFLOW WORKSPACE</span><h2>${esc(title)}</h2></div><button class="app-modal-close" onclick="closeAppModal()" aria-label="Close dialog" title="Close">×</button></header><div class="app-modal-content">${content}</div></section>`;d.addEventListener('click',e=>{if(e.target===d)closeAppModal()});document.body.append(d);document.body.style.overflow='hidden';d.querySelector('.app-modal-close')?.focus()}

function askDelete(message,onConfirm){showAppModal('Confirm deletion',`<div class="card" style="border:0;box-shadow:none;padding:0"><div style="display:flex;gap:13px;align-items:flex-start"><div class="settings-panel-icon violet" style="flex:none">!</div><div><h3 style="margin:0 0 7px">Are you sure you want to delete this item?</h3><p class="mu">${esc(message||'This action cannot be undone.')}</p></div></div><div class="row" style="justify-content:flex-end;margin-top:22px"><button class="btn s" onclick="closeAppModal()">Cancel</button><button class="btn" style="background:var(--bad);border-color:var(--bad);color:#fff" onclick="runPendingDelete()">OK</button></div></div>`,false);window.__pendingMailFlowDelete=onConfirm}

function runPendingDelete(){const fn=window.__pendingMailFlowDelete;window.__pendingMailFlowDelete=null;closeAppModal();if(typeof fn==='function')fn()}

const WPF_ADV_FORM='11108';
const WPF_DEFAULT_REQ=[
 ['I just want to know about your products',['General Enquiries']],
 ['I want to install these products, pls contact me',['General Enquiries']],
 ['I want to talk with customer care',['General Enquiries']],
 ['I have planned to take dealership',['Dealership Enquiries']],

function wpfDefaultList(id){return ['30936','11117'].includes(id)?['Dealership Enquiries']:['General Enquiries']}
function wpfAdvOn(id){const r=(S.formRules||{})[id];return !!(r&&r.advancedOnly)}
function wpfRule(id){S.formRules=S.formRules||{};let r=S.formRules[id];if(!r){r={lists:wpfDefaultList(id),rules:id===WPF_ADV_FORM?WPF_DEFAULT_REQ.map(([value,lists])=>({op:'equals',value,lists:[...lists]})):[]};}return r}
function wpfEnsure(id){S.formRules=S.formRules||{};if(!S.formRules[id])S.formRules[id]=JSON.parse(JSON.stringify(wpfRule(id)));return S.formRules[id]}
function wpfListDD(checked,attr){const lists=(S.lists&&S.lists.length)?S.lists:CORE_LISTS;const sel=lists.filter(l=>checked.includes(l));
 return `<details class="wpf-dd" ${attr}><summary><span class="wpf-sum">${sel.length?esc(sel.join(', ')):'Select list…'}</span></summary><div class="wpf-menu">${lists.map(l=>`<label><input type="checkbox" value="${esc(l)}" ${checked.includes(l)?'checked':''} onchange="wpfDDChange(this)"> ${esc(l)}</label>`).join('')}</div></details>`}
function wpfDDChange(cb){const dd=cb.closest('.wpf-dd');const vals=[...dd.querySelectorAll('input:checked')].map(i=>i.value);dd.querySelector('.wpf-sum').textContent=vals.length?vals.join(', '):'Select list…';
 if(dd.dataset.form){const r=wpfEnsure(dd.dataset.form);r.advancedOnly=false;r.lists=vals.length?vals:['General Enquiries'];save();wpfPush().then(ok=>{if(ok)toast('Saved on server: '+r.lists.join(', '))})}
 else if(dd.dataset.notif!==undefined){notifCfg().lists=vals;save()}
 else if(dd.dataset.rule!==undefined){window.wpfDraft.rules[+dd.dataset.rule].lists=vals}}
function wpfRuleCount(id){const r=(S.formRules&&S.formRules[id])?S.formRules[id]:wpfRule(id);return (r.rules||[]).filter(x=>String(x.value||'').trim()).length}
function formRulesTable(){return `<div class="tw" style="overflow:visible;max-height:none"><table style="width:100%"><thead><tr><th>Form</th><th>Form ID</th><th style="width:100%">Subscriber rule</th></tr></thead><tbody>${WPF_FORMS.map(([n,id])=>{const r=wpfRule(id),cnt=wpfRuleCount(id),on=wpfAdvOn(id);return `<tr><td style="white-space:nowrap">${esc(n)}</td><td>${id}</td><td><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><span class="mu" style="white-space:nowrap">Non-subscribed ·</span>${on?`<span class="wpf-dd" style="opacity:.6;pointer-events:none"><span class="wpf-sum" style="display:block;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:13px">Advanced rules active</span></span>`:wpfListDD(r.lists,`data-form="${id}"`)}<button class="btn s" onclick="wpfOpenAdvanced('${id}')">Advanced${cnt?' ('+cnt+')':''}</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function wpfUseDefault(id){id=id||(window.wpfDraft&&window.wpfDraft.form)||WPF_ADV_FORM;const r=wpfEnsure(id);r.advancedOnly=false;if(!r.lists||!r.lists.length)r.lists=wpfDefaultList(id);save();wpfPush().then(ok=>{if(ok)toast('Default list is active again');const t=document.getElementById('wpfRulesTable');if(t)t.innerHTML=formRulesTable();if(document.getElementById('appModal')&&window.wpfDraft){wpfBackToForms()}})}
function wpfOpenAdvanced(id){id=id||WPF_ADV_FORM;const r=wpfRule(id);const rules=JSON.parse(JSON.stringify(r.rules||[]));if(!rules.length)rules.push({field:'requirement',op:'equals',value:'',lists:[...(r.lists&&r.lists.length?r.lists:wpfDefaultList(id))]});const e=wpfEnsure(id);window.wpfDraft={form:id,lists:[...(r.lists||[])],rules,prevAdv:!!e.advancedOnly,prevLists:[...(e.lists||[])]};e.advancedOnly=true;e.lists=[];const t=document.getElementById('wpfRulesTable');if(t)t.innerHTML=formRulesTable();wpfRenderAdvanced()}
function wpfCancelAdvanced(){const d=window.wpfDraft;if(d){const e=wpfEnsure(d.form);e.advancedOnly=d.prevAdv;e.lists=d.prevLists.length||d.prevAdv?d.prevLists:wpfDefaultList(d.form)}wpfBackToForms()}
const WPF_STD=[['name','Name'],['email','Email'],['phone','Phone'],['requirement','Select your Requirements']];
const WPF_LBL={country:'Country',place:'Place',message:'Comment or Message',requirement:'Select your Requirements'};
function wpfPretty(k){if(WPF_LBL[String(k).toLowerCase()])return WPF_LBL[String(k).toLowerCase()];return String(k).replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/^./,m=>m.toUpperCase())}
function wpfFormFields(id,extra){const m=new Map();WPF_STD.forEach(([k,l])=>m.set(k,[k,l]));
 const add=k=>{k=String(k||'').trim();if(!k)return;const l=k.toLowerCase();if(!m.has(l))m.set(l,[k,wpfPretty(k)])};
 ((window.WPF_REG||{})[id]||[]).forEach(add);
 (S.contacts||[]).forEach(c=>{if(String(c.form_id||'')===id)Object.keys(c.f||{}).forEach(add)});
 (extra||[]).forEach(add);return [...m.values()]}
function wpfFieldValues(id,field){const f=String(field||'requirement'),set=new Set();
 if(f.toLowerCase()==='requirement'&&id===WPF_ADV_FORM)WPF_DEFAULT_REQ.forEach(([v])=>set.add(v));
 (S.contacts||[]).forEach(c=>{if(String(c.form_id||'')!==id)return;let v=f.toLowerCase()==='name'?c.name:f.toLowerCase()==='email'?c.email:f.toLowerCase()==='phone'?c.phone:(c.f||{})[f];if(v&&String(v).length<120)set.add(String(v))});return [...set].slice(0,40)}
function wpfPickField(i,el){const r=window.wpfDraft.rules[i];if(el.value==='__other'){const k=prompt('Type the field name exactly as the form sends it');if(k&&k.trim())r.field=k.trim().replace(/[^a-zA-Z0-9_-]/g,'_')}else r.field=el.value;wpfRenderAdvanced()}
function wpfRenderAdvanced(){const d=window.wpfDraft;
 const fields=wpfFormFields(d.form,d.rules.map(x=>x.field));
 const rows=d.rules.map((x,i)=>{const f=(x.field||'requirement'),vals=wpfFieldValues(d.form,f);return `<tr><td><select onchange="wpfPickField(${i},this)" style="width:100%">${fields.map(([k,l])=>`<option value="${esc(k)}" ${k.toLowerCase()===f.toLowerCase()?'selected':''}>${esc(l)}</option>`).join('')}<option value="__other">＋ Other field…</option></select></td><td><select onchange="wpfDraft.rules[${i}].op=this.value" style="width:100%"><option value="equals" ${x.op!=='contains'?'selected':''}>is exactly</option><option value="contains" ${x.op==='contains'?'selected':''}>contains</option></select></td><td><input style="width:100%" list="wpfdl${i}" value="${esc(x.value)}" placeholder="Value to match" oninput="wpfDraft.rules[${i}].value=this.value"><datalist id="wpfdl${i}">${vals.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist></td><td>${wpfListDD(x.lists,`data-rule="${i}"`)}</td><td><button class="btn d" title="Remove rule" onclick="wpfDraft.rules.splice(${i},1);wpfRenderAdvanced()">×</button></td></tr>`}).join('');
 const fname=(WPF_FORMS.find(f=>f[1]===d.form)||['Form'])[0];
 showAppModal(fname+' · Advanced rules',`<div class="card" style="border:0;box-shadow:none;padding:0"><p class="mu">Choose any field of <b>${esc(fname)}</b>, set the value to match, and pick the list(s) the contact should be added to. Rules are checked from top to bottom and the first match wins. While Advanced rules are active the default list and the built-in rules are switched off for this form: a contact that matches no rule goes to General Enquiries.</p><p class="mu sm">Fields listed: ${fields.map(f=>esc(f[1])).join(', ')}. A form's own fields appear here after it has received a submission; use <b>＋ Other field…</b> to type one that is missing.</p><div class="tw" style="overflow:visible;max-height:none"><table style="width:100%"><thead><tr><th style="width:200px">When field</th><th style="width:130px">Condition</th><th>Value</th><th style="width:240px">Add to list</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mu">No rules yet.</td></tr>'}</tbody></table></div><div class="row" style="margin-top:14px"><button class="btn s" onclick="wpfDraft.rules.push({field:'requirement',op:'equals',value:'',lists:['General Enquiries']});wpfRenderAdvanced()">＋ Add rule</button><span class="sp"></span><button class="btn s" onclick="wpfUseDefault(wpfDraft.form)">Use default list instead</button><button class="btn s" onclick="wpfCancelAdvanced()">Cancel</button><button class="btn" onclick="wpfSaveAdvanced()">Save rules</button></div><div style="height:130px"></div></div>`,true)}
function wpfBackToForms(){integrationPopup='';closeAppModal();render()}
function wpfSaveAdvanced(){const d=window.wpfDraft;const rules=d.rules.filter(r=>String(r.value||'').trim()).map(r=>({field:r.field||'requirement',op:r.op||'equals',value:r.value.trim(),lists:(r.lists&&r.lists.length)?r.lists:['General Enquiries']}));const r=wpfEnsure(d.form);r.rules=rules;if(rules.length){r.advancedOnly=true;r.lists=[]}else{r.advancedOnly=false;if(!r.lists||!r.lists.length)r.lists=wpfDefaultList(d.form)}save();wpfPush().then(ok=>{if(ok){toast('Advanced rules saved on server');wpfBackToForms()}})}

async function wpfPush(){try{const r=await fetch('api.php?a=formrules',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Key':KEY()},body:JSON.stringify(S.formRules||{})});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||('HTTP '+r.status));return true}catch(e){toast('Rules NOT saved on server: '+e.message);return false}}
async function wpfPull(){try{const r=await fetch('api.php?a=formrules',{headers:{'X-Api-Key':KEY()}});const j=await r.json();if(j.ok&&j.formFields)window.WPF_REG=j.formFields;if(j.ok&&j.exists&&j.rules)S.formRules=j.rules;else if(j.ok&&!j.exists&&S.formRules&&Object.keys(S.formRules).length)await wpfPush();return j}catch(e){return null}}
function wpfLogHtml(log){if(!log||!log.length)return '<p class="mu sm">No form submissions received yet.</p>';return `<div class="tw"><table><thead><tr><th>Time</th><th>Email</th><th>Form</th><th>Requirement received</th><th>Added to</th><th>Matched by</th></tr></thead><tbody>${log.map(x=>`<tr><td>${new Date(x.t*1000).toLocaleString()}</td><td>${esc(x.email)}</td><td>${esc(x.form_id)}</td><td>${esc(x.requirement||'—')}</td><td>${esc((x.lists||[]).join(', '))}</td><td>${esc(x.matched)}${x.rules_on_server?'':' (no saved rules on server)'}</td></tr>`).join('')}</tbody></table></div>`}
function manageRulesView(){return `<div class="card" style="border:0;box-shadow:none;padding:0"><p class="mu">Pick one or more lists for each form. Contacts from that form are added to the ticked lists. On <b>Main Contact</b>, use <b>Advanced</b> to route by the “Select your Requirements” dropdown. Changes are saved on the server immediately.</p><div id="wpfRulesTable">${formRulesTable()}</div><details style="margin-top:16px"><summary>Recent submissions (routing log)</summary><div id="wpfLog" style="margin-top:10px"><p class="mu sm">Loading…</p></div></details><div style="height:20px"></div></div>`}

async function openManageRules(){integrationPopup='rules';await wpfPull();renderIntegrationModal('rules');try{const r=await fetch('api.php?a=formrules',{headers:{'X-Api-Key':KEY()}});const j=await r.json();const el=document.getElementById('wpfLog');if(el)el.innerHTML=wpfLogHtml(j.log)}catch(e){const el=document.getElementById('wpfLog');if(el)el.innerHTML='<p class="mu sm">Could not load log.</p>'}}
function renderIntegrationModal(which){let title='',content='';if(which==='wpforms'){title='WordPress · WPForms integration';content=V.forms()}else if(which==='rules'){title='WPForms · Manage rules';content=manageRulesView()}else if(which==='wordpress'){title='WordPress integration';content='<div class="card"><h3>Connect WordPress</h3><p>Connect site forms and subscriber sources to MailFlow through a secured WordPress endpoint.</p><div class="settings-note"><b>Setup status</b><p>Connection is not active yet. A WordPress plugin or authenticated backend endpoint is required before live syncing can work.</p></div><button class="btn" onclick="closeAppModal();settingsSub=&#39;emailconfig&#39;;tab=&#39;set&#39;;render()">Open email configuration</button></div>'}else if(which==='crm'){title='CRM & Webhooks';content='<div class="card"><h3>CRM and webhook connections</h3><p>Future integration area for sending and receiving contact events with external systems.</p><span class="pill n">Planned integration</span></div>'}else{title='Email providers';content='<div class="card"><h3>Email provider setup</h3><p>Configure SMTP host, port, sender identity and test delivery in Email Sending.</p><button class="btn" onclick="closeAppModal();tab=&#39;set&#39;;settingsSub=&#39;sending&#39;;render()">Open Email Sending</button></div>'}showAppModal(title,content,which==='wpforms'||which==='rules')}



function saveView(){try{localStorage.setItem('mailflow_view',JSON.stringify({tab,settingsSub,q}))}catch(e){}}
function go(t){if(t==='forms'){tab='set';settingsSub='integration'}else if(t==='set'){tab='set';if(!settingsSub)settingsSub='general'}else{tab=t}document.body.classList.remove('open');saveView();render()}

const age=c=>Math.floor((Date.now()-c.created)/864e5)+S.day*0;

function ok(c,r){const v=(r.v||'').toLowerCase(),f=r.f;let x;

 if(f=='tag')x=(c.tags||[]).map(t=>String(t).toLowerCase()).includes(v);

 else if(f=='source')x=(c.source||'').toLowerCase()==v;

 else if(f=='status')x=String(c.status||'').toLowerCase()==v;

 else if(f=='domain')x=String(c.email||'').split('@')[1]==v;

 else if(f=='name')x=String(c.name||'').toLowerCase().includes(v);

 else if(f=='visited')x=(c.pages||[]).some(u=>u.toLowerCase().includes(v));

 else if(f=='pageviews')return r.o=='gt'?(c.pv||0)>+v:(c.pv||0)<+v;

 else if(f=='list')x=(c.l||[]).map(s=>s.toLowerCase()).includes(v);

 else if(f=='segment'){const t=S.segments.find(z=>z.id==r.v);x=!!t&&segHas(c,t)}

 else if(S.fields.find(z=>z.k==f))x=((c.f||{})[f]||'').toLowerCase()==v;

 else if(f=='score')return r.o=='gt'?(c.score||0)>+v:(c.score||0)<+v;

 else if(f=='age')return r.o=='gt'?age(c)>+v:age(c)<+v;

 else x=false;

 return r.o=='not'?!x:x}

function segRules(s){return (s.rules||[]).filter(r=>String(r.v==null?'':r.v).trim()!=='')}
const _sgv=new Set();
function segHas(c,s){if(Array.isArray(c.sg)&&c.sg.includes(s.id))return true;if(!segRules(s).length)return false;if(_sgv.has(s.id))return false;_sgv.add(s.id);try{return segHas2(c,s)}finally{_sgv.delete(s.id)}}
function segHas2(c,s){const R=segRules(s);if(!R.length)return false;const t=r=>{try{return !!ok(c,r)}catch(e){return false}};return s.match=='any'?R.some(t):R.every(t)}
function seg(s){const a=S.contacts.filter(c=>c.status=='subscribed');if(!s)return a;return a.filter(c=>segHas(c,s))}
const segCount=s=>S.contacts.filter(c=>segHas(c,s)).length;
let sgDrag=null;
function sgMove(id,d){const a=S.segments,i=a.findIndex(x=>x.id==id),j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveNow();pushConfig();render()}
function sgDS(e,id){sgDrag=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)}
function sgOver(e){e.preventDefault();e.currentTarget.classList.add('sg-over')}
function sgLeave(e){e.currentTarget.classList.remove('sg-over')}
function sgDrop(e,id){e.preventDefault();const a=S.segments,f=a.findIndex(x=>x.id==sgDrag),t=a.findIndex(x=>x.id==id);sgDrag=null;if(f<0||t<0||f==t)return render();const m=a.splice(f,1)[0];a.splice(t,0,m);saveNow();pushConfig('Segment order saved to database');render()}
function sgEnd(){sgDrag=null;document.querySelectorAll('.sg-over').forEach(x=>x.classList.remove('sg-over'))}
function segStats(){const un=S.contacts.filter(c=>!S.segments.some(s=>segHas(c,s)));return{total:S.contacts.length,un,assigned:S.contacts.length-un.length}}
function segStatsHtml(){const st=segStats();return `<div class="seg-stats"><div class="seg-stat"><b>${st.total}</b><span>Total emails</span></div><div class="seg-stat"><b>${st.assigned}</b><span>Assigned</span></div><button type="button" class="seg-stat seg-stat-btn" onclick="openAssign()" title="Click to assign"><b>${st.un.length}</b><span>Unassigned</span></button></div>`}
let asSel=new Set();
function openAssign(){const st=segStats();if(!st.un.length)return toast('All emails are already assigned');const man=S.segments.slice();if(!man.length)return toast('Create a segment first');asSel=new Set();
 const rows=st.un.map(c=>`<label class="as-row"><input type="checkbox" data-id="${esc(String(c.id))}" onchange="asTog(this)"><span><b>${esc(c.name||c.email)}</b><small>${esc(c.email)}</small></span></label>`).join('');
 showAppModal('Assign emails to a segment',`<div class="as-wrap"><label>Select segment(s)</label><div class="as-list" style="max-height:140px;margin-bottom:12px">${man.map(x=>`<label class="as-row"><input type="checkbox" class="asSegCb" value="${esc(x.id)}"><span><b>${esc(x.name)}</b>${segRules(x).length?'<small>Rule-based segment</small>':''}</span></label>`).join('')}</div><label>Select emails</label><div class="as-head"><label class="as-row"><input type="checkbox" onchange="asAll(this)"><span><b>Select all (${st.un.length} unassigned)</b></span></label></div><div class="as-list">${rows}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn s" onclick="closeAppModal()">Cancel</button><button class="btn" id="asBtn" onclick="doAssign()">Assign (0)</button></div></div>`,false)}
function asUpd(){const b=$('#asBtn');if(b)b.textContent='Assign ('+asSel.size+')'}
function asTog(el){const id=el.dataset.id;el.checked?asSel.add(id):asSel.delete(id);asUpd()}
function asAll(el){document.querySelectorAll('.as-list input[data-id]').forEach(x=>{x.checked=el.checked;el.checked?asSel.add(x.dataset.id):asSel.delete(x.dataset.id)});asUpd()}

function enrollAll(c){S.journeys.forEach(j=>{if(!j.active)return;const t=j.trigger;

function parseCSV(t){
 const first=(t.split(/\r?\n/,1)[0]||'');let delimiter=',',counts={',':0,';':0,'\t':0},quotedHead=false;
 for(let i=0;i<first.length;i++){const ch=first[i];if(ch==='"')quotedHead=!quotedHead;else if(!quotedHead&&Object.prototype.hasOwnProperty.call(counts,ch))counts[ch]++}
 if(counts['\t']>counts[',']&&counts['\t']>=counts[';'])delimiter='\t';else if(counts[';']>counts[','])delimiter=';';
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<t.length;i++){const ch=t[i],next=t[i+1];
  if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}
  else if(ch===delimiter&&!quoted){row.push(cell.trim());cell=''}
  else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}
  else cell+=ch;
 }
 row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows;
}

      const fresh=BUILT.find(x=>x.id===old.id);
      if(!fresh||Number(old.designVersion||0)>=2)return old;
      return {...fresh,n:old.n||fresh.n,cat:old.cat||fresh.cat,sub:fresh.sub};
    });
    BUILT.forEach(fresh=>{if(!(S.delTpls||[]).includes(fresh.id)&&!S.tpls.some(x=>x.id===fresh.id))S.tpls.push(cp(fresh))});

}

function mk(st){const d=CD;if(!d.name.trim()||!d.sub.trim()){toast('Name and subject required');return}const c={...cp(d),id:d.id||uid(),aud:sn(d.seg),pv:null,st:d.st||{sent:0,o:0,c:0,b:0,u:0},status:st,at:Date.now()};return c}

function draftC(){const c=mk('draft');if(!c)return;put(c);CD=newCD();cView='list';render()}

async function launch() {
    const c = mk('draft');
    if (!c) return;

    const L = recips(c);

    if (!L.length) {
        toast('No recipients found');
        return;
    }

    if (c.when === 'schedule') {
        if (!CD.at) {
            toast('Pick date/time');
            return;
        }

        c.status = 'scheduled';
        c.at = new Date(CD.at).getTime();

    } else {
        const live = S.cfg && S.cfg.mode === 'live';

        if (!confirm(
            (live ? 'Send REAL emails to ' : 'Send simulated emails to ') +
            L.length + ' contacts?'
        )) return;

        if (live) {
            await liveSend(c);
        } else {
            doSend(c);
        }
    }

    put(c);
    save();

    CD = newCD();
    cView = 'list';

    render();
}

function enrollAll(c){S.journeys.forEach(j=>{if(!j.active)return;const t=j.trigger||{},v=(t.v||'').toLowerCase(),h=(['subscribed','nonsub','newc','existc','verified','pending'].includes(t.type)&&trigOk(c,t)&&tm(c,t))||t.type=='sub'||(t.type=='tag'&&(c.tags||[]).some(x=>x.toLowerCase()==v))||(t.type=='list'&&(c.l||[]).some(x=>x.toLowerCase()==v))||(t.type=='source'&&(c.source||'').toLowerCase()==v)||(t.type=='score'&&(c.score||0)>=+t.v)||(t.type=='won'&&(c.tags||[]).includes('customer'))||(t.type=='visit'&&(c.pages||[]).some(u=>u.toLowerCase().includes(v))),e=(j.en||[]).find(x=>x.c==c.id);j.en=j.en||[];if(h&&trigOk(c,t)&&!e)j.en.push({c:c.id,s:0,due:S.day,due_at:Math.floor(Date.now()/1000),done:false,log:[]});else if(h&&trigOk(c,t)&&e&&e.done&&j.reenter)Object.assign(e,{s:0,due:S.day,due_at:Math.floor(Date.now()/1000),done:false,x:false,goal:false,log:[]})})}

function adv(n){if(C().mode=='live'){toast('Live automations run by the server Cron Job. Test-day controls are disabled in Live mode.');return}for(let i=0;i<n;i++){S.day++;S.journeys.forEach(j=>{if(!j.active)return;j.sc=j.sc||[];j.en.forEach(e=>{if(e.done)return;const c=S.contacts.find(x=>x.id==e.c);if(!c||!trigOk(c,j.trigger||{})){e.done=true;e.x=true;return}let g=0;while(!e.done&&e.due<=S.day&&g++<30){const s=j.steps[e.s];if(!s){e.done=true;break}j.sc[e.s]=(j.sc[e.s]||0)+1;const L=m=>(e.log=e.log||[]).push('Day '+S.day+': '+m);let nx=e.s+1;if(s.t=='wait'){const u=s.unit||'days',n=+s.days||1;e.due+=u=='days'?n:u=='hours'?Math.floor(n/24):Math.floor(n/1440);L('waited '+n+' '+u)}else if(s.t=='tag'){if(s.v&&!c.tags.includes(s.v))c.tags.push(s.v);L('tag +'+s.v)}else if(s.t=='untag'){c.tags=c.tags.filter(x=>x!=s.v);L('tag removed '+s.v)}else if(s.t=='score'){c.score=(c.score||0)+(+s.v||0);L('score '+s.v)}else if(s.t=='list'){c.l=c.l||[];if(s.v&&!c.l.includes(s.v))c.l.push(s.v);L('list +'+s.v)}else if(s.t=='unlist'){c.l=(c.l||[]).filter(x=>x!=s.v);L('list removed '+s.v)}else if(s.t=='field'){c.f=c.f||{};c.f[s.k]=s.v;L('set '+s.k)}else if(s.t=='hook'){L('webhook simulated in test mode')}else if(s.t=='status'){if(c.status!='unsubscribed'){c.status=s.v==='non-subscribed'?'non-subscribed':'subscribed'}L('status '+c.status)}else if(s.t=='notify'){L('team notified (simulated)')}else if(s.t=='stop'){e.done=true;nx=99;L('automation ended')}else if(s.t=='goal'){if(cond(s,c)){e.done=true;e.goal=true;L('goal reached');nx=99}else L('goal not met')}else if(s.t=='split'){const a=Math.random()*100<(+s.p||50);nx=a?e.s+1:(s.els>0?s.els-1:99);L('split → '+(a?'A':'B'))}else if(s.t=='if'){const y=cond(s,c);nx=y?e.s+1:(s.els>0?s.els-1:99);L('if → '+(y?'yes':'no'))}else{sim(j.st);L('simulated email: '+fill(s.sub||'',c))}e.s=nx;if(e.s>=j.steps.length)e.done=true}})})}render()}

async function saveJ(){
  if(!jD.name.trim()||!jD.steps.length)return toast('Name and steps required');
  const noTpl=jD.steps.findIndex(x=>x.t=='email'&&!String(x.body||'').trim());if(noTpl>=0)return toast('Step '+(noTpl+1)+': choose a template for the email');
  if(!dbOn)return toast('MailFlow server is not connected yet. Check the backend connection and try again.');
  const previous=S.journeys;
  const updated=cp(S.journeys);
  const draft=cp(jD);if(['newc','existc','newsub','newnon'].includes(draft.trigger.type)&&!draft.trigger.since)draft.trigger.since=Date.now();
  const i=updated.findIndex(x=>x.id==draft.id);
  if(i<0)updated.push(draft);else updated[i]=draft;
  S.journeys=updated;
  S.contacts.forEach(enrollAll);
  try{
    await persistNow();
    jD=null;
    aOpen=null;aIns=null;
    toast('Automation saved to server');
    render();
  }catch(error){
    S.journeys=previous;
    console.error('MailFlow automation save failed:',error);
    toast('Automation was not saved: '+error.message);
    render();
  }
}

async function api(p,o){
  const rawPath=String(p||'');
  const queryMatch=rawPath.match(/[?&]a=([^&]+)/);
  let action='', extra='';
  if(queryMatch){const rawAction=queryMatch[1];const qAt=rawAction.indexOf('?');action=decodeURIComponent(qAt<0?rawAction:rawAction.slice(0,qAt));extra=qAt<0?'':rawAction.slice(qAt+1);}
  else {const clean=rawPath.replace(/^\/api\//,'').replace(/^\/+/, '');const parts=clean.split('?');action=parts[0];extra=parts.slice(1).join('?');}
  const base=(C().base||'').trim().replace(/\/+$/,'');
  const url=(base?base+'/':'')+'api.php?a='+encodeURIComponent(action)+(extra?'&'+extra:'');
  const headers={...(o&&o.headers||{}),'Content-Type':'application/json','X-Api-Key':KEY()};
  const response=await fetch(url,{...(o||{}),headers});
  const raw=await response.text();
  let data;try{data=JSON.parse(raw)}catch(e){data={message:raw||('HTTP '+response.status)}}
  if(!response.ok||data.ok===false)throw new Error(data.message||('HTTP '+response.status));
  return data;
}

async function liveSend(c) {
    const L = recips(c);

    if (!L.length) {
        toast('No valid recipients found');
        c.status = 'failed';
        return;
    }

    const h = /<[a-z][\s\S]*>/i.test(c.body)
        ? c.body
        : '<div style="font:15px/1.6 Arial;white-space:pre-wrap">' + esc(c.body) + '</div>';

    c.status = 'sending';
    c.st = {sent: 0, o: 0, c: 0, b: 0, u: 0};
    c.live = true;

    render();

    try {
        const result = await api('/api/send', {
            method: 'POST',
            body: JSON.stringify({
                id: c.id,
                subject: c.sub,
                html: h,
                recipients: L.map(x => ({
                    id: x.id,
                    email: x.email,
                    name: x.name,
                    f: x.f || {}
                }))
            })
        });

        const sent = Number(result.sent || 0);
        const failed = Number(result.failed || 0);

        c.st.sent = sent;
        c.st.b = failed;

        if (sent === 0) {
            throw new Error(result.message || 'No emails were successfully sent.');
        }

        c.status = 'sent';

        toast(
            'Successfully sent: ' + sent +
            (failed ? ' | Failed: ' + failed : '')
        );

    } catch (e) {
        c.status = 'failed';
        toast('Campaign failed: ' + e.message);
    }

    render();
}

 const wp=`add_action('wpforms_process_complete', function($fields, $entry, $form_data, $entry_id) {
  $email = ''; $name = ''; $requirement = ''; $phone = ''; $contact_fields = [];
  foreach ($fields as $field_id => $field) {
    $type = strtolower((string)($field['type'] ?? ''));
    $label = strtolower((string)($field['name'] ?? ($form_data['fields'][$field_id]['label'] ?? '')));
    $value = $field['value'] ?? '';
    if (is_array($value)) $value = implode(' ', array_filter($value));
    $value = sanitize_text_field((string)$value);
    if ($type === 'email' || strpos($label, 'email') !== false) $email = sanitize_email($value);
    if ($type === 'name' || strpos($label, 'name') !== false) $name = $value;
    if (strpos($label, 'requirement') !== false || strpos($label, 'select your') !== false || strpos($label, 'interest') !== false) $requirement = $value;
    if (strpos($label, 'phone') !== false || strpos($label, 'mobile') !== false) $phone = $value;
    $field_key = sanitize_key($label);
    if (!$field_key) $field_key = 'field_' . absint($field_id);
    if (strpos($field_key, 'requirement') !== false || strpos($field_key, 'interest') !== false || strpos($field_key, 'select_your') !== false) $field_key = 'requirement';
    if (strpos($field_key, 'comment') !== false || strpos($field_key, 'message') !== false) $field_key = 'message';
    if (strpos($field_key, 'phone') !== false || strpos($field_key, 'mobile') !== false) $field_key = 'phone';
    if (strpos($field_key, 'country') !== false) $field_key = 'country';
    if (strpos($field_key, 'place') !== false || strpos($field_key, 'city') !== false) $field_key = 'place';
    $contact_fields[$field_key] = $value;
  }

  if ($requirement === '') {
    foreach ($contact_fields as $field_value) {
      $candidate = strtolower(trim((string)$field_value));
      if (strpos($candidate, 'work with mobitech') !== false ||
          strpos($candidate, 'planned to take dealership') !== false ||
          strpos($candidate, 'dealership') !== false ||
          strpos($candidate, 'just want to know about your products') !== false ||
          strpos($candidate, 'install these products') !== false ||
          strpos($candidate, 'talk with customer care') !== false) {
        $requirement = (string)$field_value; break;
      }
    }
  }
  $form_name = sanitize_text_field((string)($form_data['settings']['form_title'] ?? 'WPForms'));
  $form_id = (int)($form_data['id'] ?? 0);

    $list_name = 'Careers & Jobs';

      'list_name' => $list_name, 'consent' => 'false',

      (is_wp_error($response) ? $response->get_error_message() : wp_remote_retrieve_body($response)));
  }

function backupData(){

 try{const payload={app:'MailFlow',formatVersion:1,createdAt:new Date().toISOString(),data:S};dl('mailflow-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2));toast('Backup downloaded')}

 catch(e){toast('Could not create backup')}

}

function restoreData(input){

 const f=input.files&&input.files[0];if(!f)return;

 const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const data=j&&j.data?j.data:j;

 if(!data||!Array.isArray(data.contacts)||!Array.isArray(data.campaigns))throw new Error('Invalid backup');

 if(!confirm('Restore this backup? Current MailFlow data will be replaced.')){input.value='';return}

 S={...S,...data};save();render();toast('Backup restored')

 }catch(e){toast('Invalid backup file')}input.value=''};

 r.readAsText(f)

}



let edC=null;

const edPanel=()=>{const c=S.contacts.find(x=>x.id==edC);if(!c)return '';c.f=c.f||{};return `<div class="contact-edit-form"><p class="mu">Update profile information, custom fields and list memberships.</p><div class="settings-form-grid"><div class="settings-field"><label for="en">Full name</label><input id="en" value="${esc(c.name)}" placeholder="Contact name"></div><div class="settings-field"><label for="eem">Email address</label><input id="eem" type="email" value="${esc(c.email)}"></div><div class="settings-field"><label for="et">Tags (comma-separated)</label><input id="et" value="${esc(c.tags.join(', '))}" placeholder="coconut, farm-visit"></div><div class="settings-field"><label for="es">Lead score</label><input id="es" type="number" value="${c.score||0}"></div><div class="settings-field"><label for="est">Subscription status</label><select id="est">${c.status==='unsubscribed'?'<option value="" selected>Opted out (choose to change)</option>':''}${[['subscribed','Subscribed'],['non-subscribed','Non-subscribed']].map(([a,b])=>`<option value="${a}" ${(c.status||'non-subscribed')===a?'selected':''}>${b}</option>`).join('')}</select></div><div class="settings-field"><label for="eso">Source</label><select id="eso">${[['wpforms','WPForms'],['manual','Manual']].map(([a,b])=>`<option value="${a}" ${canonicalSource(c.source)===a?'selected':''}>${b}</option>`).join('')}</select></div><div class="settings-field"><label for="eve">Verification</label><select id="eve">${[['','Not set'],['pending','Pending'],['verified','Verified']].map(([a,b])=>`<option value="${a}" ${(c.verify_status||'')===a?'selected':''}>${b}</option>`).join('')}</select></div><div class="settings-field"><label for="efn">Form</label><input id="efn" value="${esc(c.form_name||'')}" placeholder="Form name"></div>${S.fields.map(f=>`<div class="settings-field"><label>${esc(f.label)}</label><input data-f="${esc(f.k)}" value="${esc(c.f[f.k]||'')}" placeholder="Enter ${esc(f.label.toLowerCase())}"></div>`).join('')}</div>${S.lists.length?`<div class="card" style="margin-top:16px"><h3>Lists</h3><div class="row">${S.lists.map(l=>`<label style="display:inline-flex;gap:7px;align-items:center;margin:0"><input type="checkbox" data-l="${esc(l)}" ${(c.l||[]).includes(l)?'checked':''}>${esc(l)}</label>`).join('')}</div></div>`:''}<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn s" onclick="edC=null;closeAppModal();render()">Cancel</button><button class="btn" onclick="saveC()">Save changes</button></div></div>`}

function saveC(){const c=S.contacts.find(x=>x.id==edC);{const em=($('#eem').value||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('Enter a valid email address');if(S.contacts.some(x=>x.id!=c.id&&String(x.email||'').toLowerCase()===em))return toast('Another contact already uses this email');c.email=em;c.source=$('#eso').value;c.verify_status=$('#eve').value;c.form_name=$('#efn').value.trim()}c.name=$('#en').value;c.tags=$('#et').value.split(',').map(s=>s.trim()).filter(Boolean);c.score=+$('#es').value||0;{const st=$('#est');if(st&&st.value)c.status=st.value}c.f={};document.querySelectorAll('[data-f]').forEach(i=>c.f[i.dataset.f]=i.value);{const pf=(S.fields||[]).find(x=>['phone','phonenumber'].includes(String(x.label||'').toLowerCase().replace(/[^a-z]/g,''))||x.k==='phone');if(pf)c.phone=c.f[pf.k]||''}c.l=[...document.querySelectorAll('[data-l]:checked')].map(i=>i.dataset.l);if(!c.l.length)c.l=['General Enquiries'];if(!c.tags.includes('new-lead'))c.tags.push('new-lead');edC=null;enrollAll(c);saveNow();closeAppModal();render();toast('Contact updated')}

<div class="fields-hero"><div class="fields-hero-mark">✦</div><div class="sp"><span class="modal-kicker">AUDIENCE ORGANISATION</span><h3>Build a more useful contact database</h3><p>Create custom details for every contact and group people into lists. New custom fields are available immediately in the Add Contact popup and Edit Contact profile.</p></div><div class="fields-hero-count"><b>${S.fields.length}</b><span>Custom fields</span><b style="margin-top:10px">${S.lists.length}</b><span>Lists</span></div></div>

<div class="fields-layout"><section class="card fields-card"><div class="fields-card-head"><div class="fields-icon">▤</div><div class="sp"><h3>Custom fields</h3><p class="mu sm">Capture details such as farm type, location, acreage or interests.</p></div><span class="count-pill">${S.fields.length} fields</span></div><div class="fields-add-row"><div class="fields-input-wrap"><label for="fn">Field name</label><input id="fn" placeholder="e.g. City, Farm Type, Acres" maxlength="60" onkeydown="if(event.key==='Enter'){event.preventDefault();addF()}"></div><button class="btn" type="button" onclick="addF()">＋ Add field</button></div><div class="fields-hint"><span>i</span><span>Fields you create here appear in the contact popup, contact editing, segments, CSV imports and matching WPForms entries.</span></div><div class="fields-items">${S.fields.map(f=>`<div class="field-item"><div class="field-item-icon">Aa</div><div class="sp"><b>${esc(f.label)}</b><small>Merge tag <code>{{${esc(f.k)}}}</code></small></div><span class="field-ready">Active</span><button class="btn d" title="Delete ${esc(f.label)}" onclick="askDelete('Delete this custom field? Values saved on contacts will no longer be shown.',()=>{S.fields=S.fields.filter(x=>x.k!='${esc(f.k)}');S.removedFields=(S.removedFields||[]).concat('${esc(f.k)}');render();saveNow();pushConfig('Custom field deleted')})" aria-label="Delete ${esc(f.label)}"><svg class="delete-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div>`).join('')||`<div class="fields-empty"><div class="fields-empty-icon">＋</div><b>No custom fields yet</b><p class="mu sm">Add your first field to collect more useful information about each contact.</p></div>`}</div></section>

function addF(){const el=$('#fn');if(!el)return toast('Field name input not found');const l=(el.value||'').trim();const k=l.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');if(!l)return toast('Enter a field name');if(!k)return toast('Use English letters or numbers for the field key');if((S.fields||[]).some(f=>f.k===k))return toast('A field with this name already exists');S.fields=S.fields||[];S.removedFields=(S.removedFields||[]).filter(x=>x!==k);S.fields.push({k,label:l});S.contacts.forEach(c=>{c.f=c.f||{};if(!(k in c.f))c.f[k]=''});save();pushConfig('Custom field saved to database');render()}

function addL(){const n=$('#ln').value.trim();if(!n||S.lists.some(x=>normList(x)===normList(n)))return toast('Enter a unique name');dropRemovedList(n);S.lists.push(n);ensureListSegments();save();pushConfig('List saved to database');render()}

function delL(n){askDelete('Delete the list “'+n+'”?',()=>{S.lists=S.lists.filter(x=>x!=n);S.removedLists=(S.removedLists||[]).concat(normList(n));S.contacts.forEach(c=>c.l=(c.l||[]).filter(x=>x!=n));render();saveNow();pushConfig('List deleted')})}

const STAGES=['Lead','Qualified','Proposal','Won','Lost'];

V.deals=()=>`<div class="card"><div class="row"><input id="dn" placeholder="Deal name"><input id="dv" type="number" placeholder="Value" style="width:110px"><select id="dc"><option value="">No contact</option>${S.contacts.map(c=>`<option value="${c.id}">${esc(c.email)}</option>`).join('')}</select><button class="btn" onclick="addDeal()">+ Add deal</button></div><p class="mu" style="margin:8px 0 0">Moving a deal to Won adds +20 lead score and the “customer” tag to its contact.</p></div><div class="kb">${STAGES.map(s=>{const L=S.deals.filter(d=>d.st==s);return `<div class="col"><b>${s}</b> <span class="mu">${L.length} · ${L.reduce((a,d)=>a+d.v,0)}</span>${L.map(d=>{const c=S.contacts.find(x=>x.id==d.c);return `<div class="deal"><b>${esc(d.n)}</b><div class="mu">${c?esc(c.email):'—'} · ${d.v}</div><div class="row" style="margin-top:6px"><select onchange="mvDeal('${d.id}',this.value)">${STAGES.map(x=>`<option ${x==d.st?'selected':''}>${x}</option>`).join('')}</select><button class="btn d" onclick="askDelete('Delete deal “${esc(d.n)}”?',()=>{S.deals=S.deals.filter(x=>x.id!='${d.id}');save();render()})"><svg class="delete-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div></div>`}).join('')}</div>`}).join('')}</div>`;

function addDeal(){const n=$('#dn').value.trim();if(!n)return toast('Deal name required');S.deals.push({id:uid(),n,v:+$('#dv').value||0,c:$('#dc').value,st:'Lead'});render()}

const elsSel=(s,i)=>`<select onchange="jD.steps[${i}].els=+this.value"><option value="0">Exit the automation</option>${jD.steps.map((x,k)=>k>i?`<option value="${k+1}" ${s.els==k+1?'selected':''}>Jump to step ${k+1}: ${esc(aS(x))}</option>`:'').join('')}</select>`;

function aBody(s,i){const I=(k,ph,w)=>`<input placeholder="${ph}" style="width:${w||'100%'}" value="${esc(s[k]??'')}" oninput="aUp(${i},'${k}',this.value)">`,N=(k,u)=>`<input type="number" min="0" style="width:90px" value="${s[k]??''}" oninput="aUp(${i},'${k}',this.value,1)"> ${u}`;

if(s.t=='email'){const isHtml=/<\s*[a-z][\s\S]*>/i.test(s.body||'');return `<label>Template</label><select onchange="tplStep(${i},this.value)"><option value="">Choose a template…</option>${S.tpls.map(t=>`<option value="${esc(t.id)}" ${String(s.tpl)===String(t.id)?'selected':''}>${esc(t.n)}${t.cat?' · '+esc(t.cat):''}</option>`).join('')}</select>${isHtml?`<p class="mu sm" style="margin-top:10px">The template is sent as it is, with its own subject.</p>`:`<p class="mu sm" style="margin-top:12px">Choose a template, then save the automation. The email is sent with the template's own subject and design.</p>`}`}

if(s.t=='wait')return `<label>Wait for</label><div class="row" style="gap:8px;align-items:center">${N('days','')}<select onchange="aUp(${i},'unit',this.value)">${[['minutes','Minutes'],['hours','Hours'],['days','Days']].map(([a,b])=>`<option value="${a}" ${(s.unit||'days')==a?'selected':''}>${b}</option>`).join('')}</select></div><p class="mu sm" style="margin-top:8px">Minutes and hours are checked each time the server cron runs.</p>`;if(s.t=='score')return `<label>Points to add</label>${N('v','points')}`;

if(s.t=='field')return `<label>Field key</label>${I('k','e.g. company')}<label>New value</label>${I('v','value')}`;

if(s.t=='if'||s.t=='goal')return `<label>Check if the contact…</label><select onchange="aUp(${i},'f',this.value);if(this.value=='status')aUp(${i},'v','subscribed');render()">${Object.entries(FC).map(([a,b])=>`<option value="${a}" ${s.f==a?'selected':''}>${b}</option>`).join('')}</select>${s.f=='opened'?'':s.f=='status'?`<label>Status</label><select onchange="aUp(${i},'v',this.value)">${[['subscribed','Subscribed'],['non-subscribed','Non-subscribed']].map(([a,b])=>`<option value="${a}" ${(s.v||'subscribed')==a?'selected':''}>${b}</option>`).join('')}</select>`:`<label>Value</label>${I('v',s.f=='score'?'points':'name')}`}${s.t=='if'?`<p class="mu sm" style="margin-top:12px">✔ <b>Yes</b> → continue to the next step</p><label>✖ <b>No</b> →</label>${elsSel(s,i)}`:'<p class="mu sm">When the goal is met the contact leaves the automation.</p>'}`;

if(s.t=='split')return `<label>Group A share</label>${N('p','%')}<p class="mu sm" style="margin-top:12px">Group A continues to the next step.</p><label>Group B →</label>${elsSel(s,i)}`;

if(s.t=='status')return `<label>Change the contact status to</label><select onchange="aUp(${i},'v',this.value);render()"><option value="subscribed" ${s.v!=='non-subscribed'?'selected':''}>Subscribed</option><option value="non-subscribed" ${s.v==='non-subscribed'?'selected':''}>Non-subscribed</option></select><p class="mu sm" style="margin-top:10px">Use <b>Subscribed</b> after a contact confirms. Contacts who unsubscribed are never changed.</p>`;
if(s.t=='notify')return `<label>Send to (email, comma separated)</label>${I('v','team@company.com')}<label>Subject</label>${I('sub','New lead: {{name}}')}<p class="mu sm">Your team gets the contact's name, email, phone, lists and status.</p>`;
if(s.t=='stop')return '<p class="mu sm">The contact leaves the automation here. Nothing after this step runs for them.</p>';
return `<label>${s.t=='hook'?'Webhook URL':s.t.indexOf('list')>=0?'List name':'Tag name'}</label>${I('v',s.t=='hook'?'https://…':'name')}`}

const aCard=(s,i)=>{const d=AD[s.t]||AD.email,o=aOpen==i;return `<div class="as ${o?'open':''}"><div class="ash" onclick="aOpen=${o?'null':i};render()"><span class="aic" style="background:${d[2]}22;color:${d[2]}">${SV(d[3])}</span><div class="sp"><div class="ast" id="as${i}">${esc(aS(s))}</div><div class="mu sm">Step ${i+1} · ${d[0]}</div></div><button class="btn d" onclick="aMv(${i},-1,event)" title="Move up">↑</button><button class="btn d" onclick="aMv(${i},1,event)" title="Move down">↓</button><button class="btn d" onclick="aDel(${i},event)" title="Delete"><svg class="delete-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div>${o?`<div class="asb">${aBody(s,i)}</div>`:''}</div>`};

const aMenu=i=>`<div class="amenu">${AG.map(([g,ks])=>`<div><div class="gh2">${g}</div>${ks.map(k=>`<button class="aopt" onclick="aAdd(${i},'${k}')"><span class="aic" style="background:${AD[k][2]}22;color:${AD[k][2]}">${SV(AD[k][3])}</span><span><b>${AD[k][0]}</b><small>${AD[k][1]}</small></span></button>`).join('')}</div>`).join('')}</div>`;

const aPlus=i=>`<div class="aco"><span class="ln"></span><button class="aplus" onclick="aIns=${aIns===i?'null':i};render()" aria-label="Add step">+</button><span class="ln"></span></div>${aIns===i?aMenu(i):''}`;

function aEd(){const d=jD,t=d.trigger,r=TR.find(x=>x[0]==t.type),m=S.contacts.filter(c=>trigOk(c,t)&&tm(c,t)).length,em=d.steps.filter(s=>s.t=='email').length;

return `<div class="ahd"><button class="btn s" onclick="jD=null;aOpen=aIns=null;render()">‹ Back</button><input class="nm" placeholder="Name your automation" value="${esc(d.name)}" oninput="jD.name=this.value"><label style="display:flex;gap:8px;align-items:center;margin:0">Active <button class="tgl ${d.active?'on':''}" onclick="jD.active=!jD.active;render()" aria-label="Toggle active"></button></label><button class="btn" onclick="saveJ()">Save automation</button></div>

<div class="aed"><div class="aflow"><div class="atr"><span class="aic" style="background:var(--brand);color:#fff">${SV('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>')}</span><div class="sp"><div class="mu sm">Start when</div><div class="row" style="margin-top:4px"><select onchange="jD.trigger.type=this.value;jD.trigger.v='';delete jD.trigger.aud;if(['newc','existc','newsub','newnon'].includes(this.value))jD.trigger.since=Date.now();render()">${TR.map(([a,b])=>`<option value="${a}" ${t.type==a?'selected':''}>${b}</option>`).join('')}</select>${r[2]?`<input placeholder="${r[2]}" value="${esc(t.v)}" oninput="jD.trigger.v=this.value">`:''}</div>${(t.type=='newc'||t.type=='existc'||t.type=='newsub'||t.type=='newnon')?'<p class="mu sm" style="margin:6px 0 0">Cut-off: '+new Date(t.since||Date.now()).toLocaleString()+'</p>':''}</div></div>${d.steps.map((s,i)=>aPlus(i)+aCard(s,i)).join('')}${aPlus(d.steps.length)}<div class="atr" style="border-color:var(--bd);background:var(--bg);justify-content:center;color:var(--mu)">Automation ends</div></div>

<div><div class="card"><h3>Summary</h3><div class="act"><span class="mu">Contacts matching now</span><b>${m}</b></div><div class="act"><span class="mu">Steps</span><b>${d.steps.length}</b></div><div class="act"><span class="mu">Emails</span><b>${em}</b></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" ${d.reenter?'checked':''} onchange="jD.reenter=this.checked"> Let contacts enter again</label></div><div class="card"><h3>How it works</h3><p class="mu">Contacts who match the start rule enter at the top and move down one step at a time. Press <b>+</b> between steps to add emails, waits, tags or decisions.</p></div></div></div>`}

const RD=[['Welcome series','Greet new subscribers and guide them in.'],['Lead nurture + scoring','Follow up with leads and score interest.'],['Win-back','Re-engage contacts who went quiet.']];

const aList=()=>`<div class="ph"><div><h2>Automations</h2><p class="mu">Send the right message automatically — no manual work.</p></div><span class="sp"></span><span class="mu sm" title="Test mode: fast-forward time to see waits and emails run">Test day <b>${S.day}</b></span><button class="btn s" onclick="adv(1)">+1 day</button><button class="btn s" onclick="adv(7)">+7</button><button class="btn s" onclick="adv(30)">+30</button><button class="btn" onclick="newJ()">Create automation</button></div><h3>Start from a template</h3><div class="rec">${REC.map((r,i)=>`<div class="rc"><div class="dots">${r[1].steps.slice(0,5).map(s=>{const d=AD[s.t]||AD.email;return `<span class="aic" style="background:${d[2]}22;color:${d[2]}">${SV(d[3])}</span>`}).join('')}</div><b>${r[0]}</b><span class="mu sm">${RD[i][1]}</span><button class="btn s" onclick="recJ(${i})">Use template</button></div>`).join('')}<div class="rc" style="border-style:dashed;justify-content:center;align-items:flex-start"><b>Start from scratch</b><span class="mu sm">Build your own flow step by step.</span><button class="btn s" onclick="newJ()">Create blank</button></div></div><h3>Your automations</h3>${S.journeys.map(j=>{const en=j.en,sc=j.sc||[];return `<div class="card"><div class="row"><div class="sp"><h3 style="margin:0">${esc(j.name)} <span class="pill ${j.active?'g':'n'}">${j.active?'Active':'Paused'}</span></h3><div class="mu sm" style="margin-top:2px">Starts when: ${esc(tS(j.trigger))}</div></div><button class="tgl ${j.active?'on':''}" onclick="J('${j.id}').active^=1;save();render()" aria-label="Toggle active"></button><button class="btn s" onclick="editJ('${j.id}')">Edit</button><button class="btn s" onclick="enrollExisting()">Enroll existing</button><button class="btn s" onclick="dupJ('${j.id}')">Copy</button><button class="btn d" onclick="askDelete('Delete automation “${esc(j.name)}”?',()=>{S.journeys=S.journeys.filter(x=>x.id!='${j.id}');save();render()})"><svg class="delete-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button></div><div class="kg" style="margin:14px 0">${[['Enrolled',en.length],['In progress',en.filter(e=>!e.done).length],['Completed',en.filter(e=>e.done&&!e.x&&!e.goal).length],['Goal reached',en.filter(e=>e.goal).length],['Emails sent',j.st.sent],['Open rate',pc(j.st.o,j.st.sent)]].map(([l,v])=>`<div class="kpi"><div><span>${l}</span><b>${v}</b></div></div>`).join('')}</div><div class="flow">${j.steps.map((s,i)=>{const d=AD[s.t]||AD.email;return `<div class="chip" style="border-color:${d[2]}">${esc(aS(s))}<small>${sc[i]||0}</small></div>`}).join('<span class="mu">›</span>')}</div>${en.length?`<details style="margin-top:12px"><summary>Recent activity</summary><div class="tw"><table><tr><th>Contact</th><th>Next step</th><th>Status</th><th>Last action</th></tr>${en.slice(-6).reverse().map(e=>{const c=S.contacts.find(x=>x.id==e.c);return `<tr><td>${c?esc(c.email):'—'}</td><td>${e.done?'—':e.s+1}</td><td>${e.goal?'Goal reached':e.x?'Exited':e.done?'Completed':'In progress'}</td><td class="mu">${esc((e.log||[]).slice(-1)[0]||'')}</td></tr>`}).join('')}</table></div></details>`:''}</div>`}).join('')||'<div class="card empty"><h3>No automations yet</h3><p class="mu">Pick a template above to get started in a minute.</p></div>'}`;

V.jour=()=>{getT();return jD?aEd():aList()};



window.cSourceFilter=window.cSourceFilter||'all';window.cStatusFilter=window.cStatusFilter||'all';window.cListFilter=window.cListFilter||'all';

function applyContactBulk(){const ids=[...document.querySelectorAll('[data-contact-check]:checked')].map(x=>x.value);if(!ids.length)return toast('Select at least one contact');const action=$('#bulkAction').value;if(!action)return toast('Choose a bulk action');if(action==='delete'&&!confirm('Delete '+ids.length+' selected contacts?'))return;if(action==='tag'){const tag=prompt('Tag to add to selected contacts:');if(!tag||!tag.trim())return;ids.forEach(id=>{const c=S.contacts.find(x=>x.id===id);if(c&&!c.tags.includes(tag.trim()))c.tags.push(tag.trim())})}else if(action.startsWith('list:')){const list=action.slice(5);ids.forEach(id=>{const c=S.contacts.find(x=>x.id===id);if(!c)return;c.l=[list];});}else if(action==='delete'){markDeleted(S.contacts.filter(c=>ids.includes(c.id)).map(c=>c.email));S.contacts=S.contacts.filter(c=>!ids.includes(c.id))}else ids.forEach(id=>{const c=S.contacts.find(x=>x.id===id);if(c){if(action==='subscribe'){if(c.status!=='unsubscribed')c.status='subscribed'}else c.status='unsubscribed'}});saveNow();render();toast('Updated '+ids.length+' contacts')}

render();

</script></body></html>
