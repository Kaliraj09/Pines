/* ---- device transfer (encrypted, one-time code, 5 min) ---- */
let DB=null;
const enc=new TextEncoder(),b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)},ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function gz(u,d){const c=new(d?DecompressionStream:CompressionStream)('gzip'),w=c.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(c.readable).arrayBuffer())}
async function sha(t){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
async function ck(code,salt){const k=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(code,o){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),raw=await gz(enc.encode(JSON.stringify(o))),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await ck(code,salt),raw));return[b64(salt),b64(iv),b64(ct)].join('.')}
async function unseal(code,t){const[a,b,c]=t.split('.'),raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(b)},await ck(code,ub(a)),ub(c));return JSON.parse(new TextDecoder().decode(await gz(new Uint8Array(raw),1)))}
const genCode=()=>{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>al[x%32]).join('')};
async function delX(x,n){for(let i=0;i<n;i++)await DB.doc(`xfer/${x}/c/${i}`).delete().catch(()=>{});await DB.doc('xfer/'+x).delete().catch(()=>{})}
function loggedOut(){try{localStorage.removeItem('pines');localStorage.removeItem('pines.xfer')}catch(e){}S=blank();id=null;clearTimeout(tm);$('#app').innerHTML=`<div class="lock"><div class="lk">${I('lock',34)}</div><h2 style="margin:6px 0 0">You’ve been signed out</h2><p>This account was transferred to another device and its data has been removed from this browser.</p><button class="pri" data-a="fresh">Start a new workspace</button></div>`}
async function xsend(){if(!DB)return modal(`<h3>Transfer unavailable</h3><p>${NODB}</p>`);
 const code=genCode(),exp=Date.now()+3e5;let xid=null,n=0,un=null,iv=null,done=false;
 const m=modal(`<h3>Send account</h3><p class="mut">On the other device open Settings → Transfer → Receive and enter this code.</p><div class="code" id="xc">········</div><div class="bar2"><i id="xb" style="width:100%"></i></div><div class="mut" id="xs" style="margin-top:8px">Encrypting your account…</div><p class="mut">Works once. After the other device receives it, this device is signed out automatically.</p>`);
 const kill=async()=>{done=true;clearInterval(iv);un&&un();if(xid){await delX(xid,n);try{localStorage.removeItem('pines.xfer')}catch(e){}}};
 m.querySelector('.x').addEventListener('click',kill);
 try{xid=await sha('pines-xfer:'+code);const sealed=await seal(code,{v:1,S});n=Math.ceil(sealed.length/18e4);
  for(let i=0;i<n&&!done;i++)await DB.doc(`xfer/${xid}/c/${i}`).set({d:sealed.slice(i*18e4,(i+1)*18e4)});
  if(done){await delX(xid,n);return}
  await DB.doc('xfer/'+xid).set({exp,n,st:'open'});try{localStorage.setItem('pines.xfer',JSON.stringify({id:xid,exp,n}))}catch(e){}
 }catch(e){const t=m.querySelector('#xs');if(t)t.textContent='Could not start the transfer ('+(e.code||'error')+'). You may need edit access to this page.';return kill()}
 if(done)return;m.querySelector('#xc').textContent=code.slice(0,4)+'-'+code.slice(4);
 un=DB.doc('xfer/'+xid).onSnapshot(sn=>{if(sn.exists&&sn.data().st=='received'){done=true;clearInterval(iv);un&&un();m.remove();DB.doc('xfer/'+xid).delete().catch(()=>{});loggedOut()}},()=>{});
 iv=setInterval(()=>{const left=exp-Date.now(),st=m.querySelector('#xs');if(!st){clearInterval(iv);return}if(left<=0){kill();st.textContent='Code expired. Close this and generate a new one.';m.querySelector('#xc').style.opacity=.35;m.querySelector('#xb').style.width='0';return}st.textContent=`Waiting for the other device… ${Math.floor(left/6e4)}:${String(Math.floor(left/1e3)%60).padStart(2,'0')} left`;m.querySelector('#xb').style.width=left/3e3+'%'},500)}
function xrecv(){const m=modal(`<h3>Receive account</h3><p class="mut">Enter the 8-character code shown on the sending device. Existing data on this device will be replaced (a safety copy is kept).</p><input id="rc" class="codein" maxlength="9" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false"><div class="mut" id="rs" style="margin-top:10px;min-height:18px"></div>`,()=>{go();return false},'Receive');

 async function go(){const code=m.querySelector('#rc').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!=8)return st('Enter all 8 characters.');if(!DB)return st(NODB);
  try{st('Checking code…');const x=await sha('pines-xfer:'+code),ref=DB.doc('xfer/'+x),sn=await ref.get();if(!sn.exists)return st('Invalid or expired code.');const d=sn.data();if(d.st!='open')return st('This code was already used.');if(Date.now()>d.exp+15000){delX(x,d.n);return st('This code has expired.')}
   st('Downloading…');let t='';for(let i=0;i<d.n;i++){const c=await DB.doc(`xfer/${x}/c/${i}`).get();if(!c.exists)return st('Transfer data incomplete. Ask the sender for a new code.');t+=c.data().d}
   st('Decrypting…');let o;try{o=await unseal(code,t)}catch(e){return st('Could not decrypt this transfer.')}if(!o||!o.S||!Array.isArray(o.S.scripts))return st('Transfer data is invalid.');
   try{localStorage.setItem('pines.prev',JSON.stringify(S))}catch(e){}
   const mine=S.set;S=o.S;S.set=Object.assign({},DEF,S.set||{},{theme:mine.theme,fs:mine.fs,compact:mine.compact,nav:mine.nav});save();
   await ref.update({st:'received',at:Date.now()});for(let i=0;i<d.n;i++)DB.doc(`xfer/${x}/c/${i}`).delete().catch(()=>{});
   m.remove();applyUI();syncX();home();toast('Account received')}catch(e){st('Transfer failed ('+(e.code||'error')+').')}}}
async function pendCheck(){let p=null;try{p=JSON.parse(localStorage.getItem('pines.xfer')||'null')}catch(e){}if(!p||!DB)return;try{const sn=await DB.doc('xfer/'+p.id).get();if(sn.exists&&sn.data().st=='received'){await delX(p.id,p.n);loggedOut();return}if(!sn.exists||Date.now()>p.exp+20000){await delX(p.id,p.n);localStorage.removeItem('pines.xfer')}}catch(e){}}

let FR={q:'',r:'',cs:false,sc:'all',k:-1};
const esr=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),inSc=b=>!(FR.sc=='char'&&b.t!='char'||FR.sc=='dial'&&b.t!='dial'||FR.sc=='scene'&&b.t!='scene');
function frM(s){if(!FR.q)return[];const re=new RegExp(esr(FR.q),FR.cs?'g':'gi'),M=[];s.blocks.forEach((b,i)=>{if(!inSc(b))return;let m;re.lastIndex=0;while((m=re.exec(b.x))){M.push({i,p:m.index});if(!m[0].length)re.lastIndex++}});return M}
function frCount(){const e=$('#frc');if(e){const M=frM(cur());e.textContent=FR.q?(M.length?`${Math.max(FR.k,0)+1} of ${M.length}`:'No matches'):''}}
function frGo(d){const s=cur(),M=frM(s);if(!M.length){FR.k=-1;return frCount()}FR.k=((FR.k+d)%M.length+M.length)%M.length;const t=M[FR.k];act=t.i;const a=ta(t.i);if(a){a.scrollIntoView({block:'center',behavior:'smooth'});a.focus();if(s.blocks[t.i].t!='scene')a.setSelectionRange(t.p,t.p+FR.q.length)}frCount()}

const addD=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function cast(s){const sc=scenes(s),ch={};let cc=null,sn=0;s.blocks.forEach(b=>{if(b.t=='scene')sn++;if(b.t=='char'){cc=b.x.replace(/\(.*?\)/g,'').trim().toUpperCase();if(cc){ch[cc]=ch[cc]||{n:cc,w:0};if(sc[sn-1])sc[sn-1].ch.add(cc)}}else if(b.t=='dial'&&cc&&ch[cc])ch[cc].w+=wc(b.x);else if(['scene','action','trans'].includes(b.t))cc=null});return{sc,lead:new Set(Object.values(ch).sort((a,b)=>b.w-a.w).slice(0,3).map(c=>c.n))}}

function groups(s){if(!s.days)autoSch(s);const{sc,lead}=cast(s),D=s.days.map((d,i)=>({d,i,sc:[]})),U=[];sc.forEach(c=>{const k=s.sm[c.n];(D[k]?D[k].sc:U).push(c)});return{D,U,lead,all:sc}}
function schUI(s){const g=groups(s),opt=n=>g.D.map((_,i)=>`<option value="${i}" ${n==i?'selected':''}>Day ${i+1}</option>`).join('')+`<option value="-1" ${!(n>=0&&n<g.D.length)?'selected':''}>Unscheduled</option>`;
 const tb=a=>`<div class="wrap"><table><tr><th>#</th><th>Scene</th><th>Est.</th><th>Cast</th><th>Move to</th></tr>${a.map(c=>`<tr><td>${c.n}</td><td>${esc(c.h)}</td><td>${dur(c.l/55)}</td><td>${esc([...c.ch].join(', '))}</td><td><select data-mv="${c.n}">${opt(s.sm[c.n])}</select></td></tr>`).join('')}</table></div>`;
 return `<div class="tb" style="margin-top:0;flex-wrap:wrap"><button class="pri" data-a="auto">${I('refresh',16)}Auto-schedule</button><button data-a="addday">${I('plus',16)}Add day</button><button data-a="callall">${I('file',16)}All call sheets</button><button data-a="schcsv">${I('list',16)}CSV</button><input type="date" data-sd="1" value="${esc(s.start||'')}" style="max-width:170px" title="Start date"></div><p class="mut">Scenes are grouped by location to cut travel. Change dates, call times and move scenes between days.</p>`+
 g.D.map(x=>`<div class="card dayc"><div class="dayh"><span class="dayt">Day ${x.i+1}</span><span class="chip">${x.sc.length} scenes</span><span class="chip">${dur(x.sc.reduce((a,c)=>a+c.l,0)/55)}</span><span class="chip">${new Set(x.sc.flatMap(c=>[...c.ch])).size} cast</span><span class="sp"></span><button data-a="callp" data-i="${x.i}">${I('file',15)}Call sheet</button><button class="dng ib" data-a="delday" data-i="${x.i}">${I('trash',15)}</button></div><div class="dayh"><label>Date<input type="date" data-d="${x.i}.date" value="${esc(x.d.date)}"></label><label>General call<input type="time" data-d="${x.i}.call" value="${esc(x.d.call)}"></label><label>Location<input data-d="${x.i}.loc" value="${esc(x.d.loc)}"></label><label>Notes<input data-d="${x.i}.notes" value="${esc(x.d.notes)}" placeholder="Transport, meals…"></label></div>${x.sc.length?tb(x.sc):'<p class="mut">No scenes on this day.</p>'}</div>`).join('')+(g.U.length?`<div class="card dayc"><span class="dayt">Unscheduled</span>${tb(g.U)}</div>`:'')}
const schRep=s=>{const g=groups(s),R=[];g.D.forEach(x=>x.sc.forEach(c=>R.push(['Day '+(x.i+1),x.d.date,x.d.call,x.d.loc,c.n,c.h,c.tod,dur(c.l/55),[...c.ch].join(', ')])));g.U.forEach(c=>R.push(['—','','','',c.n,c.h,c.tod,dur(c.l/55),[...c.ch].join(', ')]));return{head:['Day','Date','Call','Location','Scene','Heading','Time','Est.','Cast'],rows:R}};
function callHTML(s,i){const g=groups(s),D=g.D[i],d=D.d,cs={};D.sc.forEach(c=>c.ch.forEach(n=>(cs[n]=cs[n]||[]).push(c.n)));const dt=d.date?new Date(d.date+'T00:00:00').toDateString():'Date to be confirmed';
 return `<div class="cs"><h2>CALL SHEET — ${esc(s.title)}</h2><p>Day ${i+1} of ${g.D.length} · <b>${esc(dt)}</b> · General call <b>${esc(d.call)}</b><br>Location: <b>${esc(d.loc||'—')}</b><br>Writer: ${esc(s.writer)} · Version ${V(s)}${s.rev?' · '+RC[s.rev][0]+' revision':''}</p><h3>Scenes</h3><table><tr><th>Scene</th><th>Heading</th><th>I/E</th><th>Time</th><th>Est.</th></tr>${D.sc.map(c=>`<tr><td>${c.n}</td><td>${esc(c.h)}</td><td>${esc(c.io)}</td><td>${esc(c.tod)}</td><td>${dur(c.l/55)}</td></tr>`).join('')}</table><h3>Cast</h3><table><tr><th>Character</th><th>Scenes</th><th>Call</th></tr>${Object.entries(cs).map(([n,a])=>`<tr><td>${esc(n)}</td><td>${a.join(', ')}</td><td>${esc(d.call)}</td></tr>`).join('')}</table><h3>Notes</h3><p>${esc(d.notes||'—')}</p><h3>Logistics</h3><table><tr><th>Item</th><th>Details</th></tr><tr><td>Sunrise / sunset</td><td></td></tr><tr><td>Nearest hospital</td><td></td></tr><tr><td>Transport</td><td></td></tr><tr><td>Catering</td><td></td></tr></table></div>`}
const callDoc=h=>`<html><head><meta charset="utf-8"><style>${css()}body{max-width:none;font-family:Inter,Arial,sans-serif;font-size:11pt}.cs{page-break-after:always}</style></head><body>${h}</body></html>`;
/* ---- Budget ---- */
const BD={cur:'₹',crew:50000,loc:10000,lead:20000,sup:8000,night:20,art:3000,post:10000,music:5000,cont:10};
function bud(s){const B=Object.assign({},BD,s.bud||{}),g=groups(s),f=n=>B.cur+Math.round(n).toLocaleString('en-IN'),R=[];let tot=0;
 [...g.D.map(x=>({n:'Day '+(x.i+1),l:x.d.loc,sc:x.sc})),...(g.U.length?[{n:'Unscheduled',l:'—',sc:g.U}]:[])].forEach(x=>{if(!x.sc.length)return;const nt=x.sc.filter(c=>c.tod=='NIGHT'||c.tod=='EVENING').length/x.sc.length,crew=B.crew*(1+nt*B.night/100),loc=B.loc*new Set(x.sc.map(c=>c.loc)).size,cast=[...new Set(x.sc.flatMap(c=>[...c.ch]))].reduce((a,n)=>a+(g.lead.has(n)?B.lead:B.sup),0),art=B.art*x.sc.length,t=crew+loc+cast+art;tot+=t;R.push({n:x.n,l:x.l,sc:x.sc,crew,loc,cast,art,t})});
 const m=pages(s.blocks),post=B.post*m,mus=B.music*m,sub=tot+post+mus,con=sub*B.cont/100;return{B,R,post,mus,con,sub,grand:sub+con,f,m,tot}}
function budRep(s){const b=bud(s),f=b.f;return{head:['Item','Scenes','Crew & equipment','Locations','Cast','Art & props','Total'],rows:[...b.R.map(x=>[x.n+' · '+x.l,x.sc.length,f(x.crew),f(x.loc),f(x.cast),f(x.art),f(x.t)]),['Post-production','','','','','',f(b.post)],['Music & sound','','','','','',f(b.mus)],['Contingency '+b.B.cont+'%','','','','','',f(b.con)],['GRAND TOTAL','','','','','',f(b.grand)]]}}
function budScene(s){const b=bud(s),f=b.f,R=[];b.R.forEach(x=>{const L=x.sc.reduce((a,c)=>a+c.l,0)||1;x.sc.forEach(c=>R.push([c.n,c.h,x.n,f(x.t*c.l/L)]))});return{head:['Scene','Heading','Shoot day','Est. cost'],rows:R.sort((a,b)=>a[0]-b[0])}}
function budUI(s){const b=bud(s),B=b.B,f=b.f,F=[['crew','Crew & equipment / day'],['loc','Location fee / location / day'],['lead','Lead cast / day'],['sup','Supporting cast / day'],['night','Night premium %'],['art','Art & props / scene'],['post','Post / runtime minute'],['music','Music / runtime minute'],['cont','Contingency %']];
 return `<div class="st4"><div class="stc"><b>${f(b.grand)}</b><span>Estimated total</span></div><div class="stc"><b>${f(b.tot)}</b><span>Production</span></div><div class="stc"><b>${f(b.post+b.mus)}</b><span>Post & music</span></div><div class="stc"><b>${f(b.con)}</b><span>Contingency</span></div></div>
 <div class="card"><b>Rates</b> <span class="mut">Adjust to your market — estimates update instantly</span><div class="fg" style="margin-top:8px"><label>Currency<select data-b="cur">${opts(['₹','$','€','£'],B.cur)}</select></label>${F.map(([k,n])=>`<label>${n}<input type="number" min="0" data-b="${k}" value="${B[k]}"></label>`).join('')}</div></div>
 <div class="tb"><h3 style="margin:0;flex:1">By shoot day</h3><button data-a="budcsv">${I('download',16)}CSV</button><button data-a="budpr">${I('file',16)}Print / PDF</button></div><div class="wrap">${tbl(budRep(s))}</div><h3>By scene</h3><div class="wrap">${tbl(budScene(s))}</div><p class="mut">Rough planning figures only. Cast is charged per day they appear; the three characters with the most dialogue count as leads.</p>`}
/* ---- PWA install ---- */
let IP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e});
document.addEventListener('change',e=>{const a=e.target,s=cur();if(!s)return;if(a.dataset.b){s.bud=s.bud||{};s.bud[a.dataset.b]=a.dataset.b=='cur'?a.value:+a.value;save();dash()}else if(a.dataset.d){const[i,k]=a.dataset.d.split('.');s.days[+i][k]=a.value;save()}else if(a.dataset.mv){s.sm[a.dataset.mv]=+a.value;save();dash()}else if(a.dataset.sd){s.start=a.value;save()}});
function newA(){return{
 fr:()=>{const e=$('#frp');if(!e)return;if(e.innerHTML){e.innerHTML='';return}e.innerHTML=frUI();$('[data-fr=q]').focus()},frn:()=>frGo(1),frp1:()=>frGo(-1),frr:frRep,fra:frAll,
 rev:()=>{const s=cur();modal(`<h3>Revision colour</h3><p class="mut">Choose the current revision. Edits made while marking is on are tinted in that colour and carried into exports.</p><div class="rvg">${RC.map((c,i)=>`<label><input type="radio" name="rv" value="${i}" ${(s.rev||0)==i?'checked':''}><i style="background:${c[1]}"></i>${c[0]}</label>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="rvm" style="width:auto" ${s.rm?'checked':''}> Mark my changes</label><div class="rwb" style="margin-top:12px"><button data-a="rclr">Clear all marks</button></div>`,m=>{s.rev=+m.querySelector('[name=rv]:checked').value;s.rm=m.querySelector('#rvm').checked&&s.rev>0;save();dash()},'Apply')},
 rclr:()=>{const s=cur();s.blocks.forEach(b=>delete b.r);save();dash();toast('Revision marks cleared')},
 kE:()=>{const a=ta(act);a&&a.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}))},kT:()=>{const a=ta(act);a&&a.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true}))},
 auto:()=>{autoSch(cur());save();dash();toast('Schedule generated')},addday:()=>{const s=cur();groups(s);s.days.push({date:s.start?addD(s.start,s.days.length):'',call:'06:00',loc:'',notes:''});save();dash()},
 delday:i=>{const s=cur();i=+i;s.days.splice(i,1);Object.keys(s.sm).forEach(k=>{if(s.sm[k]==i)s.sm[k]=-1;else if(s.sm[k]>i)s.sm[k]--});save();dash()},
 callp:i=>printHTML(callDoc(callHTML(cur(),+i))),callall:()=>{const s=cur();printHTML(callDoc(groups(s).D.map(x=>callHTML(s,x.i)).join('')))},
 schcsv:()=>{const s=cur();dl(fn(s)+'_schedule.csv','text/csv',csv(schRep(s)))},budcsv:()=>{const s=cur();dl(fn(s)+'_budget.csv','text/csv',csv(budRep(s)))},
 budpr:()=>{const s=cur();printHTML(`<html><head><meta charset="utf-8"><style>${css()}body{max-width:none;font-family:Inter,Arial,sans-serif}</style></head><body><h2>${esc(s.title)} – Budget estimate</h2>${tbl(budRep(s))}<h3>By scene</h3>${tbl(budScene(s))}</body></html>`)},
 inst:()=>{if(IP){IP.prompt();IP=null;return}modal(`<h3>Install Pines</h3><p><b>Android / Chrome:</b> menu ⋮ → Install app (or Add to Home screen).</p><p><b>iPhone / Safari:</b> Share → Add to Home Screen.</p><p><b>Desktop Chrome / Edge:</b> install icon in the address bar.</p><p class="mut">For a fully offline app, host the included pines-pwa folder (index.html, manifest, service worker, icons) on any static host such as Netlify or GitHub Pages.</p>`)}}}
/* ---- Actions ---- */
const A={settings:()=>settings(),st:i=>{stab=i;settings()},theme:i=>{S.set.theme=i;applyUI();save();settings()},xsend,xrecv,imp:()=>$('#imf').click(),
 bk:()=>{dl('Pines_backup_'+today()+'.json','application/json',JSON.stringify(S,null,1));S.set.lastBackup=Date.now();save();settings();toast('Backup downloaded')},
 wipe:()=>{modal(`<h3>Erase all data?</h3><p>This permanently deletes every screenplay on this device. Type <b>DELETE</b> to confirm.</p><input id="wc" placeholder="DELETE">`,m=>{if(m.querySelector('#wc').value.trim()!='DELETE')return toast('Type DELETE to confirm'),false;S=blank();save();applyUI();home();toast('All data erased')},'Erase everything')},
 fresh:()=>{S=blank();save();applyUI();home()},tt:()=>{const s=cur();s.ta=!tam(s);save();dash()},new:newS,home,tab:i=>{tab=i;dash()},rt:i=>{rtab=i;dash()},open:i=>{id=i;tab='write';act=0;dash()},
 del:i=>{const s=S.scripts.find(x=>x.id==i);modal(`<h3>Delete “${esc(s.title)}”?</h3><p>This removes it from this browser permanently.</p>`,()=>{S.scripts=S.scripts.filter(x=>x.id!=i);save();home()},'Delete')},
 ty:i=>{const s=cur();setType(s,s.blocks[act],T[i],act)},go:i=>focus(+i),sg:i=>SG[i].f(),
 ns:()=>{const s=cur();s.blocks.splice(act+1,0,nb('scene'));act++;rebuild(s);focus(act);showSg();persist()},
 ver:()=>{const s=cur();modal(`<h3>Update version?</h3><p>Current: v${V(s)}. This saves a snapshot you can restore later.</p><label><input type="radio" name="vt" value="min" checked style="width:auto"> Minor → v${s.v[0]}.${s.v[1]+1}</label><label><input type="radio" name="vt" value="maj" style="width:auto"> Major → v${s.v[0]+1}.0</label>`,m=>{const maj=m.querySelector('[value=maj]').checked;s.v=maj?[s.v[0]+1,0]:[s.v[0],s.v[1]+1];s.history.push({v:V(s),at:Date.now(),blocks:JSON.parse(JSON.stringify(s.blocks))});s.saved=JSON.stringify(s.blocks);save();toast('Saved as v'+V(s));dash()},'Confirm & update')},
 restore:i=>{const s=cur(),h=s.history[i];modal(`<h3>Restore v${h.v}?</h3><p>It replaces the current draft. Save a new version afterwards if you wish.</p>`,()=>{s.blocks=JSON.parse(JSON.stringify(h.blocks));save();tab='write';act=0;dash()},'Restore')},
 ex:i=>EX[i](cur()),rprint:()=>{const s=cur();printHTML(`<html><head><meta charset="utf-8"><style>${css()}body{max-width:none}</style></head><body><h2>${esc(s.title)} – ${rtab}</h2>${tbl(reps(s)[rtab])}</body></html>`)},
 rcsv:()=>{const s=cur();dl(fn(s)+'_'+rtab.replace(/\s/g,'_')+'.csv','text/csv',csv(reps(s)[rtab]))},
 addl:()=>{const v=$('#nl').value.trim();if(v&&!S.langs.includes(v)){S.langs.push(v);save();rr()}},
 rml:i=>{S.scripts.forEach(s=>{if(s.lang==i)s.lang=S.langs.find(l=>l!=i)});S.langs=S.langs.filter(l=>l!=i);if(S.set.defLang==i)S.set.defLang=S.langs[0];save();rr()}};
document.addEventListener('click',e=>{if(e.target.closest('.ov')&&!e.target.closest('[data-a]'))return;const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a=='open'&&e.target.closest('[data-a=del]'))return;e.preventDefault();A[a.dataset.a](a.dataset.i)});
Object.assign(A,newA());
applyUI();syncX();home();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
